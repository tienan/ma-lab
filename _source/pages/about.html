<section class="section" id="about" aria-labelledby="about-title">
  <div class="shell"><div class="section-heading"><h1 id="about-title">${about_heading}</h1></div>
    <div class="about-grid"><div><h3>${experience_heading}</h3><div class="timeline">${experience}</div></div><div><h3>${education_heading}</h3><div class="timeline">${education}</div></div></div>
    <p class="students-bookmark" id="students"><a href="${people_href}#students">${students_moved}</a></p>
    <details class="talks-disclosure"><summary>${talks_heading} <span class="talk-count">${talk_count}</span><span class="disclosure-icon" aria-hidden="true">+</span></summary><div class="talks-list">${talks}</div></details>
    <details class="talks-disclosure service-disclosure"><summary>${journal_review_heading} <span class="disclosure-icon" aria-hidden="true">+</span></summary><div class="service-note">${journal_review}</div></details>
  </div>
</section>
