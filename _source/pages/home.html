<section class="hero" id="profile" aria-labelledby="hero-title">
  <div class="shell hero-grid">
    <div class="hero-copy">
      <p class="eyebrow status-line">${portrait_role}</p>
      <h1 class="hero-title" id="hero-title">${name}</h1>
      <p class="hero-subtitle">${hero_subtitle}</p>
      <p class="hero-description">${hero_description}</p>
      <div class="hero-actions"><a class="button" href="${research_href}">${explore_research} <span aria-hidden="true">↗</span></a><a class="button secondary" href="${publications_href}">${selected_publications} <span aria-hidden="true">↗</span></a></div>
      <div class="social-links" aria-label="${profiles_label}">${social_links}</div>
    </div>
    <div class="portrait-panel">
      <div class="portrait-frame"><img class="portrait" src="${assets_prefix}portrait.jpeg" width="3363" height="3377" alt="${portrait_alt}"></div>
      <div class="portrait-caption"><span class="portrait-role">${university}</span></div>
    </div>
  </div>
</section>
