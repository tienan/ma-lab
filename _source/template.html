<!doctype html>
<html lang="${lang}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="${description}">
  <meta name="theme-color" content="#153c49">
  <title>${page_title}</title>
  <link rel="canonical" href="${canonical}">
  <link rel="alternate" hreflang="en" href="${alternate_en}">
  <link rel="alternate" hreflang="zh-CN" href="${alternate_zh}">
  <link rel="alternate" hreflang="x-default" href="${alternate_en}">
  <link rel="icon" href="${assets_prefix}favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="${assets_prefix}site.css">
  <script id="site-i18n" type="application/json">${i18n_json}</script>
  <script src="${assets_prefix}site.js" defer></script>
</head>
<body id="home" data-page="${page}">
<a class="skip-link" href="#main">${skip}</a>
<div class="masthead">
  <div class="shell masthead-inner">
    <a class="brand" href="${home_href}" aria-label="${home_label}"><span class="brand-mark" aria-hidden="true">SM</span><span><span class="brand-name">${name}</span><span class="brand-caption">${university}</span></span></a>
    <div class="language-switch" role="group" aria-label="${language_label}"><a class="language-link" lang="en" hreflang="en" href="${en_href}"${en_current}>English</a><span aria-hidden="true">/</span><a class="language-link" lang="zh-CN" hreflang="zh-CN" href="${zh_href}"${zh_current}>中文</a></div>
  </div>
</div>
${banner}
<header class="site-header">
  <div class="shell header-inner">
    <nav id="site-nav" aria-label="${navigation_label}">
      ${nav_links}
    </nav>
    <div class="header-controls">
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="${menu_open}"><span class="menu-label">${menu}</span><span class="menu-icon" aria-hidden="true">☰</span></button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
${page_content}
</main>
<footer class="site-footer"><div class="shell footer-inner"><span>${name} <span aria-hidden="true">/</span> ${university}</span><a href="#home">${back_to_top} <span aria-hidden="true">↑</span></a></div></footer>
</body>
</html>
